apiVersion: apps/v1
kind: Deployment
metadata:
  name: add-task
spec:
  replicas: 3
  selector:
    matchLabels:
      app: add-task
  template:
    metadata:
      labels:
        app: add-task
    spec:
      containers:
      - name: add-task
        env:
          - name: CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: dbdetails
                key: CONNECTION_STRING
        image: devopsinsiders/add-task
        ports:
        - containerPort: 8000
